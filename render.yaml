services:
  - type: web
    name: bolo-khana
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MOCK_SARVAM
        value: "0"
      - key: SARVAM_API_KEY
        sync: false
